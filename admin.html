<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم عهد</title>
<style>
  :root{
    --gold:#c9a227; --gold-2:#b8901e;
    --ink:#1c1a16; --muted:#6b6558;
    --line:#e8e3d8; --bg:#fdfcfa; --card:#ffffff;
    --ok:#2f7d4f; --warn:#b3711b; --bad:#b3271f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Tajawal','Segoe UI',Arial,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 80px}

  /* شاشة تسجيل الدخول */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    width:100%;max-width:360px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:32px 28px;
    box-shadow:0 8px 30px rgba(28,26,22,.06);
  }
  .seal{
    width:56px;height:56px;border-radius:50%;margin:0 auto 18px;
    background:radial-gradient(circle at 32% 28%, #f3e3ab, var(--gold) 55%, #7a621a);
    display:grid;place-items:center;color:#241c05;font-weight:800;font-size:15px;
  }
  .login-card h1{font-size:19px;text-align:center;margin:0 0 24px;font-weight:800}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:700}
  input{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;margin-bottom:16px;background:#fbfaf7;color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold);outline-offset:1px}
  button{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    color:#241c05;font-weight:800;font-size:15px;cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:default}
  #loginError{color:var(--bad);font-size:13.5px;margin:-6px 0 14px;display:none}

  /* لوحة التحكم */
  #dashboard{display:none}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;flex-wrap:wrap;gap:12px;
  }
  header.top h1{font-size:22px;margin:0;font-weight:800}
  header.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
  #logoutBtn{
    width:auto;padding:9px 18px;background:none;border:1px solid var(--line);
    color:var(--ink);font-weight:700;font-size:13.5px;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;
  }
  .stat-card .label{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .stat-card .value{font-size:28px;font-weight:800}
  .stat-card .value.gold{color:var(--gold-2)}

  .section{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;margin-bottom:18px;
  }
  .section h2{font-size:15px;margin:0 0 14px;font-weight:800}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted)}
  .row .v{font-weight:700}

  .pill{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
  }
  .pill.opened{background:#eaf5ee;color:var(--ok)}
  .pill.ready{background:#fdf1e2;color:var(--warn)}
  .pill.sealed{background:#eef0f4;color:var(--muted)}

  #stateMsg{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="seal">عهد</div>
    <h1>لوحة تحكم عهد</h1>
    <div id="loginError"></div>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">تسجيل الدخول</button>
  </div>
</div>

<div id="dashboard">
  <div class="wrap">
    <header class="top">
      <div>
        <h1>لوحة تحكم عهد</h1>
        <div class="sub" id="genAt"></div>
      </div>
      <button id="logoutBtn">تسجيل الخروج</button>
    </header>

    <div id="stateMsg">جارِ تحميل البيانات...</div>

    <div id="content" style="display:none">
      <div class="grid">
        <div class="stat-card">
          <div class="label">إجمالي المستخدمين</div>
          <div class="value" id="totalUsers">—</div>
        </div>
        <div class="stat-card">
          <div class="label">إجمالي الكبسولات</div>
          <div class="value" id="totalCapsules">—</div>
        </div>
        <div class="stat-card">
          <div class="label">كبسولات هدية</div>
          <div class="value" id="giftCapsules">—</div>
        </div>
        <div class="stat-card">
          <div class="label">الإيرادات الشهرية التقديرية</div>
          <div class="value gold" id="revenue">—</div>
        </div>
      </div>

      <div class="section">
        <h2>الكبسولات حسب الحالة</h2>
        <div id="capsulesByStatus"></div>
      </div>

      <div class="section">
        <h2>الاشتراكات حسب الخطة والحالة</h2>
        <div id="subsByPlan"></div>
      </div>

      <div class="section">
        <h2>آخر 20 إشعار مُرسَل</h2>
        <div id="recentNotifications"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ⚠️ عدّل القيمتين التاليتين قبل الرفع:
// SUPABASE_URL: نفسه المستخدم بباقي المشروع (Project Settings → API → Project URL)
// SUPABASE_ANON_KEY: من نفس الصفحة (Project API keys → anon public) — آمن أنه يكون
// ظاهر بالكود، هذا هو الغرض منه، لا يعطي وصول لبيانات غير المستخدم المسجّل دخوله.
const SUPABASE_URL = "https://eppgvtreajfstwybodmn.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwcGd2dHJlYWpmc3R3eWJvZG1uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNjM4NjYsImV4cCI6MjA5OTkzOTg2Nn0.dyW9m29ONQFWymowcQiqjLIEaeuSWDAan3OyFpiCFw0";
const ADMIN_STATS_URL = SUPABASE_URL + "/functions/v1/admin-stats";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);

async function tryRestoreSession() {
  const { data } = await sb.auth.getSession();
  if (data?.session) {
    showDashboard();
    loadStats(data.session.access_token);
  }
}

$("loginBtn").addEventListener("click", async () => {
  $("loginError").style.display = "none";
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "جارٍ الدخول...";

  const { data, error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value,
  });

  $("loginBtn").disabled = false;
  $("loginBtn").textContent = "تسجيل الدخول";

  if (error || !data?.session) {
    $("loginError").textContent = "بيانات الدخول غير صحيحة.";
    $("loginError").style.display = "block";
    return;
  }

  showDashboard();
  loadStats(data.session.access_token);
});

$("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

function showDashboard() {
  $("loginScreen").style.display = "none";
  $("dashboard").style.display = "block";
}

async function loadStats(token) {
  $("stateMsg").style.display = "block";
  $("stateMsg").textContent = "جارِ تحميل البيانات...";
  $("content").style.display = "none";

  try {
    const res = await fetch(ADMIN_STATS_URL, {
      method: "POST",
      headers: { Authorization: "Bearer " + token },
    });
    const data = await res.json();

    if (!res.ok) {
      $("stateMsg").textContent =
        res.status === 403
          ? "هذا الحساب غير مصرَّح له بدخول لوحة التحكم."
          : "تعذّر تحميل البيانات: " + (data.error || res.status);
      return;
    }

    render(data);
    $("stateMsg").style.display = "none";
    $("content").style.display = "block";
  } catch (e) {
    $("stateMsg").textContent = "تعذّر الاتصال بالخادم.";
  }
}

function render(d) {
  $("genAt").textContent = "آخر تحديث: " + new Date(d.generated_at).toLocaleString("ar-EG");
  $("totalUsers").textContent = d.total_users ?? 0;
  $("totalCapsules").textContent = d.total_capsules ?? 0;
  $("giftCapsules").textContent = d.gift_capsules ?? 0;
  $("revenue").textContent = (d.estimated_monthly_active_revenue_aed ?? 0).toLocaleString("ar-EG") + " د.إ";

  const statusLabels = { sealed: "مختومة", ready: "جاهزة للفتح", opened: "مفتوحة" };
  $("capsulesByStatus").innerHTML = Object.entries(d.capsules_by_status || {})
    .map(([k, v]) => `
      <div class="row">
        <span class="k"><span class="pill ${k}">${statusLabels[k] || k}</span></span>
        <span class="v">${v}</span>
      </div>`)
    .join("") || "<p style='color:var(--muted)'>لا بيانات</p>";

  $("subsByPlan").innerHTML = Object.entries(d.subscriptions_by_plan_status || {})
    .map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`)
    .join("") || "<p style='color:var(--muted)'>لا اشتراكات مدفوعة بعد</p>";

  $("recentNotifications").innerHTML = (d.recent_notifications || [])
    .map(
      (n) => `
      <div class="row">
        <span class="k">${n.type} — كبسولة ${String(n.capsule_id).slice(0, 8)}</span>
        <span class="v">${new Date(n.sent_at).toLocaleString("ar-EG")}</span>
      </div>`
    )
    .join("") || "<p style='color:var(--muted)'>لا إشعارات مسجّلة بعد</p>";
}

tryRestoreSession();
</script>
</body>
</html>
